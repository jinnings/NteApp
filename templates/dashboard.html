<!DOCTYPE html>
<html>
<head>
    <title>Trading Alerts Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }

        h1 {
            color: #38bdf8;
        }

        .card {
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: scale(1.02);
        }

        .time {
            font-size: 12px;
            margin-bottom: 5px;
            opacity: 0.85;
        }

        .time-bold {
            font-weight: bold;
        }

        .message {
            font-size: 14px;
            white-space: pre-wrap;
        }

        .buy {
            background: linear-gradient(135deg, #065f46, #22c55e);
            color: #ecfdf5;
        }

        .sell {
            background: linear-gradient(135deg, #7f1d1d, #ef4444);
            color: #fef2f2;
        }

        .neutral {
            background: #1e293b;
        }

        .count-box {
            text-align: right;
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            min-width: 70px;
        }

        .buy-text { color: #22c55e; }
        .sell-text { color: #ef4444; }

    </style>
</head>

<body>

<h1>📊 Trading Alerts</h1>

<div id="alerts-container">
    Loading alerts...
</div>

<script>

// ✅ Load stored counts
let stockCounts = JSON.parse(localStorage.getItem("stockCounts")) || {};
let lastResetDate = localStorage.getItem("lastResetDate");

// ✅ Convert time
function convertToIST(utcTime) {
    const date = new Date(utcTime + " UTC");

    const formatted = date.toLocaleString("en-IN", {
        timeZone: "Asia/Kolkata",
        day: "2-digit",
        month: "short",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    });

    const parts = formatted.split(", ");

    return `
        ${parts[0]}, <span class="time-bold">${parts[1]}</span>
    `;
}

// ✅ DAILY RESET (IST)
function checkDailyReset() {

    let now = new Date();

    // IST date
    let today = now.toLocaleDateString("en-IN", {
        timeZone: "Asia/Kolkata"
    });

    if (lastResetDate !== today) {
        stockCounts = {};
        localStorage.setItem("stockCounts", JSON.stringify(stockCounts));
        localStorage.setItem("lastResetDate", today);
    }
}

function loadAlerts() {

    // ✅ reset if needed
    checkDailyReset();

    fetch("/api/alerts")
        .then(res => res.json())
        .then(data => {

            let html = "";

            data.forEach(alert => {

                let cls = "neutral";

                if (alert.message.includes("BUY")) cls = "buy";
                else if (alert.message.includes("SELL")) cls = "sell";

                // ✅ Extract stock (FIRST WORD)
                let match = alert.message.match(/^[A-Z]+/);
                let stock = match ? match[0] : "UNKNOWN";

                // ✅ init
                if (!stockCounts[stock]) {
                    stockCounts[stock] = { buy: 0, sell: 0 };
                }

                // ✅ increment
                if (alert.message.includes("BUY")) {
                    stockCounts[stock].buy++;
                } 
                else if (alert.message.includes("SELL")) {
                    stockCounts[stock].sell++;
                }

                let counts = stockCounts[stock];

                html += `
                    <div class="card ${cls}">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            
                            <div>
                                <div class="time">${convertToIST(alert.time)}</div>
                                <div class="message">${alert.message}</div>
                            </div>

                            <div class="count-box">
                                <div class="buy-text">BUY: ${counts.buy}</div>
                                <div class="sell-text">SELL: ${counts.sell}</div>
                            </div>

                        </div>
                    </div>
                `;
            });

            // ✅ SAVE updated counts
            localStorage.setItem("stockCounts", JSON.stringify(stockCounts));

            document.getElementById("alerts-container").innerHTML = html;
        })
        .catch(err => console.error("Error:", err));
}

// ✅ initial load
loadAlerts();

// ✅ auto refresh
setInterval(loadAlerts, 5000);

</script>

</body>
</html>
