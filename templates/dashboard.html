<!DOCTYPE html>
<html>
<head>
    <title>Trading Alerts Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }

        h1 {
            color: #38bdf8;
        }

        .card {
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: scale(1.02);
        }

        .time {
            font-size: 12px;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .message {
            font-size: 14px;
            white-space: pre-wrap;
        }

        /* ✅ BUY */
        .buy {
            background: linear-gradient(135deg, #065f46, #22c55e);
            color: #ecfdf5;
        }

        /* ✅ SELL */
        .sell {
            background: linear-gradient(135deg, #7f1d1d, #ef4444);
            color: #fef2f2;
        }

        /* ✅ DEFAULT */
        .neutral {
            background: #1e293b;
        }
    </style>
</head>

<body>

<h1>📊 Trading Alerts</h1>

<div id="alerts-container">
    Loading alerts...
</div>

<script>
function loadAlerts() {
    fetch("/api/alerts")   // ✅ matches Flask route
        .then(res => res.json())
        .then(data => {

            let html = "";

            data.forEach(alert => {

                let cls = "neutral";

                if (alert.message.includes("BUY")) cls = "buy";
                else if (alert.message.includes("SELL")) cls = "sell";

                html += `
                    <div class="card ${cls}">
                        <div class="time">${alert.time}</div>
                        <div class="message">${alert.message}</div>
                    </div>
                `;
            });

            document.getElementById("alerts-container").innerHTML = html;
        })
        .catch(err => console.error("Error:", err));
}

// ✅ initial load
loadAlerts();

// ✅ auto refresh every 5 sec (no page reload)
setInterval(loadAlerts, 5000);
</script>

</body>
</html>
