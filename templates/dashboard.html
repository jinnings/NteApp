<!DOCTYPE html>
<html>
<head>
    <title>Trading Alerts Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }

        h1 {
            color: #38bdf8;
        }

        .card {
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: scale(1.02);
        }

        .time {
            font-size: 12px;
            margin-bottom: 5px;
            opacity: 0.85;
        }

        .time-bold {
            font-weight: bold;
        }

        .message {
            font-size: 14px;
            white-space: pre-wrap;
        }

        /* ✅ BUY */
        .buy {
            background: linear-gradient(135deg, #065f46, #22c55e);
            color: #ecfdf5;
        }

        /* ✅ SELL */
        .sell {
            background: linear-gradient(135deg, #7f1d1d, #ef4444);
            color: #fef2f2;
        }

        /* ✅ DEFAULT */
        .neutral {
            background: #1e293b;
        }
    </style>
</head>

<body>

<h1>📊 Trading Alerts</h1>

<div id="alerts-container">
    Loading alerts...
</div>

<script>
function convertToIST(utcTime) {
    const date = new Date(utcTime + " UTC");

    // ✅ Split date and time
    const formatted = date.toLocaleString("en-IN", {
        timeZone: "Asia/Kolkata",
        day: "2-digit",
        month: "short",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    });

    // Example: "22 Jun, 04:35:10 PM"
    const parts = formatted.split(", ");

    return `
        ${parts[0]}, <span class="time-bold">${parts[1]}</span>
    `;
}

function loadAlerts() {
    fetch("/api/alerts")
        .then(res => res.json())
        .then(data => {

            let html = "";

            data.forEach(alert => {

                let cls = "neutral";

                if (alert.message.includes("BUY")) cls = "buy";
                else if (alert.message.includes("SELL")) cls = "sell";

                html += `
                    <div class="card ${cls}">
                        <div class="time">${convertToIST(alert.time)}</div>
                        <div class="message">${alert.message}</div>
                    </div>
                `;
            });

            document.getElementById("alerts-container").innerHTML = html;
        })
        .catch(err => console.error("Error:", err));
}

// ✅ initial load
loadAlerts();

// ✅ auto refresh every 5 sec
setInterval(loadAlerts, 5000);
</script>

</body>
</html>
