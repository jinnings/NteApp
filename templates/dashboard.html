<!DOCTYPE html>
<html>
<head>
    <title>Trading Alerts Dashboard</title>
    <meta http-equiv="refresh" content="5">
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }
        h1 {
            color: #38bdf8;
        }
        .card {
            background: #1e293b;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
        }
        .time {
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<h1>📊 Trading Alerts</h1>

{% for alert in alerts %}
<div class="card">
    <div class="time">{{ alert.time }}</div>
    <pre>{{ alert.message }}</pre>
</div>
{% endfor %}

</body>
</html>
