<!DOCTYPE html>
<html>
<head>
    <title>Nte App Trading Bot Dashboard</title>

    <style>
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: Arial;
        }

        .container {
            width: 600px;
            margin: auto;
            margin-top: 30px;
        }

        .alert {
            background: #1e293b;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
        }

        .buy { border-left: 5px solid #22c55e; }
        .sell { border-left: 5px solid #ef4444; }
        .system { border-left: 5px solid #3b82f6; }

        .status {
            margin-top: 5px;
            font-size: 13px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>📊 Nte Alerts</h2>
    <div id="alerts"></div>
</div>

<script>
async function loadAlerts() {
    const res = await fetch("/api/alerts");
    const data = await res.json();

    const container = document.getElementById("alerts");
    container.innerHTML = "";

    data.forEach(alert => {

        let html = "";

        // ✅ SYSTEM ALERT
        if (!alert.symbol) {
            html = `
                <div class="alert system">
                    <b>ℹ️ SYSTEM</b><br>
                    ${alert.message}
                    <div class="status">${alert.time}</div>
                </div>
            `;
        }
        else {
            const entry = alert.entry ?? "-";
            const sl = alert.sl ?? "-";
            const target = alert.target ?? "-";
            const direction = alert.direction ?? "";

            let cls = direction === "BUY" ? "buy" : "sell";

            html = `
                <div class="alert ${cls}">
                    <b>${alert.symbol} ${direction}</b><br>
                    Entry: ${entry} <br>
                    SL: ${sl} <br>
                    Target: ${target}
                    <div class="status">
                        ${alert.status || ""} | ${alert.time}
                    </div>
                </div>
            `;
        }

        container.innerHTML += html;
    });
}

setInterval(loadAlerts, 2000);
loadAlerts();
</script>

</body>
</html>
