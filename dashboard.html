<!DOCTYPE html>
<html>
<head>
    <title>Trading Alerts Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }

        .card {
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
        }

        .buy { background: #22c55e; }
        .sell { background: #ef4444; }
        .neutral { background: #64748b; }

        button {
            padding: 10px;
            background: #ef4444;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        button:hover {
            background: #dc2626;
        }
    </style>
</head>

<body>

<h1>📊 Trading Alerts</h1>

<!-- ✅ LIVE STATS -->
<h2>📈 Live Stats</h2>
<div id="stats">Loading...</div>

<button onclick="resetStats()">🔄 Reset Stats</button>

<hr>

<!-- ✅ ALERTS -->
<div id="alerts-container">Loading...</div>


<script>
function convertToIST(utcTime) {
    const date = new Date(utcTime + " UTC");

    return date.toLocaleString("en-IN", {
        timeZone: "Asia/Kolkata"
    });
}


// ✅ LOAD ALERTS
function loadAlerts() {
    fetch("/api/alerts")
        .then(res => res.json())
        .then(data => {

            let html = "";

            data.forEach(alert => {

                let cls = "neutral";

                if (alert.status !== "OPEN") {
                    cls = "neutral";
                } else {
                    if (alert.direction === "BUY") cls = "buy";
                    else if (alert.direction === "SELL") cls = "sell";
                }

                html += `
                    <div class="card ${cls}">
                        <div>${convertToIST(alert.time)}</div>
                        <div><b>${alert.symbol} ${alert.direction}</b></div>
                        <div>Strategy: ${alert.strategy}</div>
                        <div>Entry: ${alert.entry}</div>
                        <div>SL: ${alert.sl}</div>
                        <div>Target: ${alert.target}</div>
                        <div><b>Status: ${alert.status}</b></div>
                    </div>
                `;
            });

            document.getElementById("alerts-container").innerHTML = html;
        });
}


// ✅ LOAD STATS
function loadStats() {
    fetch("/api/stats")
        .then(res => res.json())
        .then(data => {
            document.getElementById("stats").innerHTML = `
                <div class="card neutral">
                    ✅ Scanned: ${data.scanned}<br>
                    🟢 Open Trades: ${data.open_trades}<br>
                    ⚪ Closed Trades: ${data.closed_trades}<br>
                    💰 P&L: ₹${data.pnl}
                </div>
            `;
        });
}


// ✅ RESET BUTTON
function resetStats() {
    fetch("/api/reset", {
        method: "POST"
    })
    .then(res => res.json())
    .then(data => {
        alert("✅ Stats Reset!");
        loadStats();
    });
}


// ✅ AUTO REFRESH
loadAlerts();
loadStats();

setInterval(loadAlerts, 3000);
setInterval(loadStats, 3000);

</script>

</body>
</html>
