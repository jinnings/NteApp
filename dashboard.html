<!DOCTYPE html>
<html>
<head>
    <title>Trading Alerts Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }

        h1 {
            color: #38bdf8;
        }

        .card {
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
        }

        .time {
            font-size: 12px;
        }

        .time-bold {
            font-weight: bold;
        }

        .buy { background: #22c55e; }
        .sell { background: #ef4444; }
        .neutral { background: #1e293b; }
    </style>
</head>

<body>

<h1>📊 Trading Alerts</h1>
<div id="alerts-container">Loading...</div>

<script>
function convertToIST(utcTime) {
    const date = new Date(utcTime + " UTC");

    const formatted = date.toLocaleString("en-IN", {
        timeZone: "Asia/Kolkata",
        day: "2-digit",
        month: "short",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    });

    const parts = formatted.split(", ");
    return `${parts[0]}, <span class="time-bold">${parts[1]}</span>`;
}

function loadAlerts() {
    fetch("/api/alerts")
        .then(res => res.json())
        .then(data => {

            let html = "";

            data.slice(0, 50).forEach(alert => {

                let cls = "neutral";
                if (alert.message.includes("BUY")) cls = "buy";
                else if (alert.message.includes("SELL")) cls = "sell";

                html += `
                    <div class="card ${cls}">
                        <div class="time">${convertToIST(alert.time)}</div>
                        <div>${alert.message}</div>
                    </div>
                `;
            });

            document.getElementById("alerts-container").innerHTML = html;
        });
}

loadAlerts();
setInterval(loadAlerts, 5000);
</script>

</body>
</html>
