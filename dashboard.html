<!DOCTYPE html>
<html>
<head>
<title>Trading Dashboard</title>

<style>
body { font-family: Arial; background:#0f172a; color:#e2e8f0; padding:20px; }
.card { padding:15px; margin:10px 0; border-radius:10px; }
.buy { background:#22c55e; }
.sell { background:#ef4444; }
.neutral { background:#64748b; }
button { padding:10px; background:red; border:none; color:white; border-radius:5px; cursor:pointer; }
</style>

</head>

<body>

<h1>📊 Trading Dashboard</h1>

<h2>📈 Live Stats</h2>
<div id="stats"></div>

<button onclick="resetStats()">🔄 Reset Stats</button>

<hr>

<div id="alerts"></div>

<script>

function loadStats(){
fetch('/api/stats')
.then(res=>res.json())
.then(d=>{
document.getElementById("stats").innerHTML=
`<div class="card neutral">
✅ Scanned: ${d.scanned}<br>
🟢 Open: ${d.open_trades}<br>
⚪ Closed: ${d.closed_trades}<br>
💰 P&L: ₹${d.pnl}
</div>`;
});
}

function loadAlerts(){
fetch('/api/alerts')
.then(res=>res.json())
.then(data=>{
let h="";
data.forEach(a=>{

let cls="neutral";
if(a.status==="OPEN"){
cls = a.direction==="BUY"?"buy":"sell";
}

h+=`<div class="card ${cls}">
${a.symbol} ${a.direction}<br>
Entry: ${a.entry}<br>
SL: ${a.sl} | TGT: ${a.target}<br>
Status: ${a.status}
</div>`;
});
document.getElementById("alerts").innerHTML=h;
});
}

function resetStats(){
fetch('/api/reset',{method:'POST'})
.then(()=>{
document.getElementById("alerts").innerHTML="";
loadStats();
});
}

setInterval(loadStats,3000);
setInterval(loadAlerts,3000);

loadStats();
loadAlerts();

</script>

</body>
</html>
